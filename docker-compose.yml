services:
  # YouTube POT Token Provider required by yt-dlp child runner to bypass bot detection
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: mithril-worker-bgutil-provider
    restart: unless-stopped
    init: true
    ports:
      - "4416:4416"
    networks:
      - mithril-net

  # FlareSolverr service instance required by the worker and yt-dlp runner
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: mithril-worker-flaresolverr
    restart: unless-stopped
    ports:
      - "38191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - PROXY=${FLARESOLVERR_PROXY:-}
    networks:
      - mithril-net

  # Pre-build yt-dlp runner image so Docker daemon has it locally without registry authentication issues
  yt-dlp-runner:
    build:
      context: ./yt-dlp-runner
      dockerfile: Dockerfile
    image: ghcr.io/jvrcruzgames/yt-dlp-runner:latest
    restart: "no"
    entrypoint: ["echo", "yt-dlp runner image ready."]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mithril-worker-1
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - WORKER_NAME=${WORKER_NAME:-Mithril Worker}
      - WORKER_HOST=0.0.0.0
      - WORKER_PORT=8001
      - WORKER_BASE_URL=${WORKER_BASE_URL:-https://worker.yourdomain.com}
      - HEALTH_ENDPOINT=/health
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-https://dl.jvrcruz.games}
      - ADMIN_KEY=${ADMIN_KEY:-}
      - DOCKER_NETWORK=mithril-network
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - FLARESOLVERR_PROXY=${FLARESOLVERR_PROXY:-}
      - BGUTIL_POT_PROVIDER_URL=http://bgutil-provider:4416
      - INACTIVITY_TIMEOUT_SECONDS=1200
      - AUTO_ANNOUNCE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - flaresolverr
      - bgutil-provider
      - yt-dlp-runner
    networks:
      - mithril-net

networks:
  mithril-net:
    name: mithril-network
    driver: bridge
